name: Multiplatform Desktop Build

on:
  push:
    branches:
      - main
      - dev
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Desktop App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout assets
        run: git -c submodule."assets".update=checkout submodule update --init assets || true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package
        run: pnpm package

      - name: Make Installers
        run: pnpm make || true

      - name: Upload Make Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stoat-desktop-${{ matrix.os }}
          path: |
            out/make/**/*
            out/*.zip
            out/*.tar.gz
